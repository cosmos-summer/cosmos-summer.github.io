<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Cosmos Summer — a personal corner of the internet, coming soon."
    />
    <meta name="theme-color" content="#080b16" />
    <meta property="og:url" content="https://cosmos-summer.github.io/" />
    <link rel="canonical" href="https://cosmos-summer.github.io/" />
    <title>Cosmos Summer — Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&amp;family=Manrope:wght@400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="glow" aria-hidden="true"></div>

    <header>
      <a class="wordmark" href="./" aria-label="Cosmos Summer, home">
        <span class="mark" aria-hidden="true">✶</span>
        <span>COSMOS / SUMMER</span>
      </a>
      <p class="status"><span aria-hidden="true"></span> Site in progress</p>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">Personal space / coming soon</p>
        <h1 id="page-title">A small corner<br />of the <em>internet.</em></h1>
        <p class="summary">
          This space is taking shape. Soon it will be home to my work, notes,
          and things worth sharing.
        </p>
        <div class="links">
          <!-- Replace these placeholders with your real contact and profile links. -->
          <a class="primary-link" href="mailto:hello@example.com">
            Say hello <span aria-hidden="true">↗</span>
          </a>
          <a class="secondary-link" href="https://github.com/cosmos-summer">
            GitHub <span aria-hidden="true">↗</span>
          </a>
        </div>
      </section>

      <div class="orbit" aria-hidden="true">
        <div class="ring ring-outer"><span class="moon"></span></div>
        <div class="ring ring-inner"></div>
        <div class="planet"><span></span></div>
      </div>
    </main>

    <footer>
      <!-- Replace "Your Name" with your name. -->
      <p>© 2026 Your Name</p>
      <p>Stay curious.</p>
    </footer>
  </body>
</html>
